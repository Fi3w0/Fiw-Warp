name: Auto release

on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: fiw-warp-jars
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish the verified version
        env:
          GH_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          DESCRIPTION_FILE: modrinth.md
        run: |
          set -euo pipefail
          source .github/scripts/targets.sh
          VERSION="$(awk -F= '$1 == "mod_version" {print $2}' gradle.properties)"
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists; use the tag release recovery workflow if needed."
            exit 0
          fi
          test -n "$MODRINTH_TOKEN"
          test "$(find release -name '*.jar' | wc -l)" -eq "${#TARGETS[@]}"
          for target in "${TARGETS[@]}"; do
            read -r module _ _ <<< "$target"
            jar="$(jar_path "$module" "$VERSION")"
            mkdir -p "$(dirname "$jar")"
            cp "release/$(basename "$jar")" "$jar"
          done
          awk -v ver="$VERSION" '
            /^## \[/ { if (p) exit; if (index($0, "[" ver "]")) p=1 }
            p { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md
          VERSION="$VERSION" bash .github/scripts/publish-modrinth.sh
          gh release create "$TAG" release/*.jar --target "${{ github.event.workflow_run.head_sha }}" \
            --title "$DISPLAY_NAME $VERSION" --notes-file RELEASE_NOTES.md
