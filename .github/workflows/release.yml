name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN_SET: ${{ secrets.MODRINTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --stacktrace

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/player-tests/package-lock.json

      - name: Install pinned player test client
        run: npm ci --prefix .github/player-tests --ignore-scripts

      - name: Verify production gameplay and restarts
        run: |
          source .github/scripts/targets.sh
          VERSION="$(awk -F= '$1 == "mod_version" {print $2}' gradle.properties)"
          for target in "${TARGETS[@]}"; do
            read -r module _ _ <<< "$target"
            python3 .github/scripts/smoke-test.py "$module" "$(jar_path "$module" "$VERSION")" --player-script .github/player-tests/gameplay.cjs --player-phases first,restart
          done

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ ("\\[" ver "\\]")) { found=1; next }
              next
            }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::error::No CHANGELOG.md section found for version $VERSION (expected a '## [$VERSION] - ...' heading)"
            exit 1
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Collect all release jars
        run: VERSION="${GITHUB_REF_NAME#v}" bash .github/scripts/collect-jars.sh

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
          files: release/*.jar

      - name: Publish every Modrinth target and sync description
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          DESCRIPTION_FILE: modrinth.md
          CHANGELOG: ${{ steps.changelog.outputs.notes }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$VERSION" = "$(awk -F= '$1 == "mod_version" {print $2}' gradle.properties)"
          printf '%s\n' "$CHANGELOG" > RELEASE_NOTES.md
          VERSION="$VERSION" bash .github/scripts/publish-modrinth.sh

      - name: Retain production verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-verification
          path: build/smoke/**/*.log
          if-no-files-found: ignore
          retention-days: 14
